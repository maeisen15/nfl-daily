# NFL Daily — source configuration
#
# The orchestrator (pipeline/orchestrator.py) reads this on every run.
# Edit freely: add, remove, swap, toggle `enabled`. When you add a source on a NEW domain,
# also add that domain (apex + wildcard) to docs/network-allowlist.txt and to the cloud
# routine's network allowlist, or the scheduled run will get a 403 fetching it.
#
# Per-news-source keys beyond the fetcher's own:
#   rank:            integer, lower = higher priority. Published on every article as
#                    `source_rank` (default 99 when unset); the app sorts the Ravens tab by it,
#                    and it decides which article survives when duplicates of the same story
#                    are clustered together. Ranks are spaced by 10 so a new source can slot
#                    between two existing ones without renumbering.
#   fetch_og_image:  opt in to fetching each article page for its og:image. Only set it on
#                    sources whose feed/index page carries no thumbnail of its own — it costs
#                    one extra HTTP request per imageless item on every run.

# ---- News pages ----------------------------------------------------------------------------
news_sources:
  - id: espn_nfl
    name: "ESPN NFL"
    url: "https://www.espn.com/nfl/"
    rss_url: "https://www.espn.com/espn/rss/nfl/news"
    fetch: "rss"
    rank: 20
    fetch_og_image: true
    # espn.com sits behind Akamai, which answers the icon crawl with an empty 202. The CDN
    # host serves the same mark without the bot wall.
    icon_url: "https://a.espncdn.com/favicon.ico"
    enabled: true

  - id: cbs_nfl
    name: "CBS Sports NFL"
    url: "https://www.cbssports.com/nfl/"
    rss_url: "https://www.cbssports.com/rss/headlines/nfl/"
    fetch: "rss"
    rank: 30
    enabled: true

  - id: nyt_athletic_nfl
    name: "NYT Athletic NFL"
    url: "https://www.nytimes.com/athletic/nfl/"
    rss_url: "https://www.nytimes.com/athletic/rss/nfl"
    fetch: "rss"
    rank: 10
    enabled: true

  - id: fox_nfl
    name: "FOX Sports NFL"
    url: "https://www.foxsports.com/nfl"
    rss_url: "https://api.foxsports.com/v2/content/optimized-rss?partnerKey=MB0Wehpmuj2lUhuRhQaafhBjAJqaPU244mlTDK1i&size=30&tags=fs/nfl"
    fetch: "rss"
    rank: 40
    enabled: true

  - id: nfl_com_news
    name: "NFL.com News"
    url: "https://www.nfl.com/news/"
    fetch: "html"
    # NFL.com is a fully client-rendered React app with no embedded API. Article URLs match
    # /news/<slug> and are present in the static HTML. Anchor text ends in "Month DD" — we
    # parse that into published_at so strict recency filtering can work.
    link_pattern: "^/news/[a-z0-9-]{10,}$"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    date_strategy: "title_suffix_month_day"
    max_items: 40
    rank: 50
    fetch_og_image: true
    enabled: true

# ---- Analysis-only sources ----------------------------------------------------------------
analysis_sources:
  - id: ringer_nfl
    name: "The Ringer NFL"
    url: "https://www.theringer.com/topic/nfl"
    fetch: "html"
    # Ringer has no RSS; topic page lists articles as /<yyyy>/<mm>/<dd>/<topic>/<slug> where
    # topic contains 'nfl'. Date is in the URL — extract it.
    link_pattern: "^/20[0-9]{2}/[0-9]{2}/[0-9]{2}/[a-z0-9-]*nfl[a-z0-9-]*/[a-z0-9-]+"
    link_base: "https://www.theringer.com"
    title_strategy: "anchor_text"
    date_strategy: "url_yyyy_mm_dd"
    max_items: 30
    rank: 45
    fetch_og_image: true
    enabled: true

# ---- Structured data ----------------------------------------------------------------------
# Authoritative sources for Transactions + Injuries. ESPN's hidden API is preferred; NFL.com
# pages are cross-source secondaries. The synthesis prompt grounds transaction/injury bullets
# in these — fabrication of transactions/injuries is a critical bug.
structured_data:
  - id: espn_injuries
    name: "ESPN Injuries (API)"
    fetch: "espn_api"
    type: "espn_injuries"
    # Single league-wide endpoint returning expanded data in one call.
    # Returns expanded data in one call — simpler than the per-team-id loop in the original plan.
    link_destination: "https://www.espn.com/nfl/injuries"
    max_items: 200
    enabled: true

  - id: espn_transactions
    name: "ESPN Transactions (API)"
    fetch: "espn_api"
    type: "espn_transactions"
    # Endpoint requires /seasons/<YEAR>/ scoping. Empty for the upcoming season during deep
    # offseason — fetcher falls back to prior season automatically.
    link_destination: "https://www.espn.com/nfl/transactions"
    max_items: 200
    enabled: true

  - id: nfl_com_injuries
    name: "NFL.com Injuries (cross-source)"
    url: "https://www.nfl.com/injuries/"
    fetch: "html"
    # Page renders per-game injury reports under .nfl-o-injury-report__unit. Anchors inside
    # link to player profiles or game pages. In deep offseason the page is mostly empty —
    # expected `warn` status until preseason. Selector regex below catches player-profile
    # anchors when present.
    link_pattern: "^/players/[a-z0-9-]+/"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    assume_current: true   # status page has no per-item dates; treat items as current (see html.py)
    max_items: 80
    enabled: true

  - id: nfl_com_transactions
    name: "NFL.com Transactions (cross-source)"
    url: "https://www.nfl.com/transactions/"
    fetch: "html"
    # Currently renders class="nfl-o-no-results" — empty during offseason. When populated,
    # transaction rows include player-profile anchors; same selector strategy as injuries.
    # Expect `warn` (0 items) until offseason traffic begins.
    link_pattern: "^/players/[a-z0-9-]+/"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    assume_current: true   # status page has no per-item dates; treat items as current (see html.py)
    max_items: 80
    enabled: true

# ---- Twitter ------------------------------------------------------------------------------
# Tweets do NOT flow through the orchestrator. The Cloudflare Worker (worker/) polls
# twitterapi.io for these handles on a waking-hours cadence and stores what it finds; the app
# reads them from there. See docs/SETUP.md.
#
# This list is the single source of truth for who is watched. After editing it:
#   python3 pipeline/tweets.py --mode sync-handles
# The Worker builds its poll query from that table, so editing this file alone does nothing.
#
# One request covers every handle, so handles are close to free until the query no longer fits
# in one: 21 fit, and the 22nd adds a second request per poll (~+$1.09/month). The sync command
# says so when you cross that line.
#
# Per-handle flags:
#   feed:      true → tweets appear in the app's Tweets tab (default: true)
#   feed_only: true → tweets appear in the Tweets tab but are NOT quotable by the digest
#                     (default: false → the digest may cite them)
# Routing: twitter_news_* / twitter_analysis_* → NFL tab. Handles under team_coverage.primary
# → Ravens tab. Handles under a rival → that rival's tab.

twitter_news_handles:
  - handle: "AdamSchefter"
    name: "Adam Schefter"
    enabled: true
    feed: true
  - handle: "RapSheet"
    name: "Ian Rapoport"
    enabled: true
    feed: true
  - handle: "MikeGarafolo"
    name: "Mike Garafolo"
    enabled: true
    feed: true
  - handle: "JayGlazer"
    name: "Jay Glazer"
    enabled: true
    feed: true
  - handle: "PSchrags"
    name: "Peter Schrager"
    enabled: true
    feed: true

twitter_analysis_handles:
  - handle: "BenjaminSolak"
    name: "Ben Solak"
    enabled: true
    feed: true
    feed_only: true
  - handle: "KevinCole___"
    name: "Kevin Cole"
    enabled: true
    feed: true
    feed_only: true
  - handle: "minakimes"
    name: "Mina Kimes"
    enabled: true
    feed: true
    feed_only: true
  - handle: "ASchatzNFL"
    name: "Aaron Schatz"
    enabled: true
    feed: true
    feed_only: true

# ---- Team coverage --------------------------------------------------------------------------
# Drives the Ravens and Rivals tabs in the web viewer. One `primary` team (Ravens) plus a list
# of `rivals` (Steelers at launch; add Bengals, Browns, Chiefs, Bills as needed). Source IDs:
#   - Ravens news:      ravens_news_<slug>
#   - Ravens twitter:   ravens_twitter_<handle>
#   - Rival news:       rival_<team_code_lower>_news_<slug>
#   - Rival twitter:    rival_<team_code_lower>_twitter_<handle>
# The Ravens tab synthesizes EVERY transaction/injury (no tier filter); the Rivals tab applies
# the same Tier 1/2 filter as the National tab. ESPN league-wide transactions+injuries data
# is filtered by team_code at synthesis time — no per-team ESPN fetches.
team_coverage:
  primary:
    team_code: BAL
    display_name: "Baltimore Ravens"
    news_sources:
      - id: ravens_news_athletic
        name: "NYT Athletic — Ravens"
        url: "https://www.nytimes.com/athletic/nfl/team/ravens/"
        rss_url: "https://www.nytimes.com/athletic/rss/nfl/ravens/"
        fetch: "rss"
        rank: 10
        enabled: true

      - id: ravens_news_russell_street
        name: "Russell Street Report"
        url: "https://russellstreetreport.com/"
        rss_url: "https://russellstreetreport.com/feed/"
        fetch: "rss"
        rank: 40
        fetch_og_image: true
        enabled: true

      - id: ravens_news_banner
        name: "The Baltimore Banner — Ravens"
        url: "https://www.thebanner.com/topic/sports/ravens-nfl/"
        fetch: "html"
        # Banner has no Ravens-filtered RSS feed (Arc XP category feeds return empty for
        # /sports/ravens-nfl/); scrape the topic page and parse article:published_time from
        # each article page.
        link_pattern: "^/sports/ravens-nfl/[a-zA-Z0-9-]+/?$"
        link_base: "https://www.thebanner.com"
        title_strategy: "anchor_text"
        date_strategy: "article_meta"
        max_items: 25
        rank: 20
        enabled: true

      - id: ravens_news_official
        name: "Baltimore Ravens — Official News"
        url: "https://www.baltimoreravens.com/news/all-news"
        fetch: "html"
        # DataDome blocks the /rss/ endpoint; the news index page loads fine. Articles have
        # JSON-LD datePublished — article_meta picks it up.
        link_pattern: "^/news/[a-z0-9-]{10,}/?$"
        link_base: "https://www.baltimoreravens.com"
        # The anchor wraps the card image and a category label, so its text reads
        # "news News & Notes: … Sep 07, 2026". aria-label carries the clean headline.
        title_strategy: "attribute:aria-label"
        date_strategy: "article_meta"
        max_items: 25
        rank: 50
        enabled: true

      - id: ravens_news_sun
        name: "Baltimore Sun — Ravens"
        url: "https://www.baltimoresun.com/sports/nfl/baltimore-ravens/"
        fetch: "html"
        # Sun's RSS endpoint (sports/nfl/baltimore-ravens/feed/) returns 403 even with browser
        # headers; HTML page loads fine. Article URLs are /YYYY/MM/DD/<slug>/; we require
        # "ravens" in the slug to filter out sidebar/footer noise from non-Ravens articles.
        link_pattern: "/(20\\d{2})/(\\d{2})/(\\d{2})/[a-z0-9-]*ravens[a-z0-9-]*/?$"
        link_base: "https://www.baltimoresun.com"
        title_strategy: "anchor_text"
        date_strategy: "url_yyyy_mm_dd"
        max_items: 25
        rank: 30
        enabled: true

