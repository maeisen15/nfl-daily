# NFL Daily Digest — source configuration (starter)
#
# This file lives at ~/.nfl-digest/sources.yaml at runtime.
# Edit freely: add, remove, swap, toggle `enabled`. The orchestrator reads this on every run.
#
# Phase 2 wires the five news pages + The Ringer analysis.
# Phase 3 adds structured-data (transactions/injuries). Phase 4 adds Twitter.

# ---- News pages ----------------------------------------------------------------------------
news_sources:
  - id: espn_nfl
    name: "ESPN NFL"
    url: "https://www.espn.com/nfl/"
    rss_url: "https://www.espn.com/espn/rss/nfl/news"
    fetch: "rss"
    enabled: true

  - id: cbs_nfl
    name: "CBS Sports NFL"
    url: "https://www.cbssports.com/nfl/"
    rss_url: "https://www.cbssports.com/rss/headlines/nfl/"
    fetch: "rss"
    enabled: true

  - id: nyt_athletic_nfl
    name: "NYT Athletic NFL"
    url: "https://www.nytimes.com/athletic/nfl/"
    rss_url: "https://www.nytimes.com/athletic/rss/nfl"
    fetch: "rss"
    enabled: true

  - id: fox_nfl
    name: "FOX Sports NFL"
    url: "https://www.foxsports.com/nfl"
    rss_url: "https://api.foxsports.com/v2/content/optimized-rss?partnerKey=MB0Wehpmuj2lUhuRhQaafhBjAJqaPU244mlTDK1i&size=30&tags=fs/nfl"
    fetch: "rss"
    enabled: true

  - id: nfl_com_news
    name: "NFL.com News"
    url: "https://www.nfl.com/news/"
    fetch: "html"
    # NFL.com is a fully client-rendered React app with no embedded API. Article URLs match
    # /news/<slug> and are present in the static HTML. Anchor text ends in "Month DD" — we
    # parse that into published_at so strict recency filtering can work.
    link_pattern: "^/news/[a-z0-9-]{10,}$"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    date_strategy: "title_suffix_month_day"
    max_items: 40
    enabled: true

# ---- Analysis-only sources ----------------------------------------------------------------
analysis_sources:
  - id: ringer_nfl
    name: "The Ringer NFL"
    url: "https://www.theringer.com/topic/nfl"
    fetch: "html"
    # Ringer has no RSS; topic page lists articles as /<yyyy>/<mm>/<dd>/<topic>/<slug> where
    # topic contains 'nfl'. Date is in the URL — extract it.
    link_pattern: "^/20[0-9]{2}/[0-9]{2}/[0-9]{2}/[a-z0-9-]*nfl[a-z0-9-]*/[a-z0-9-]+"
    link_base: "https://www.theringer.com"
    title_strategy: "anchor_text"
    date_strategy: "url_yyyy_mm_dd"
    max_items: 30
    enabled: true

# ---- Structured data ----------------------------------------------------------------------
# Authoritative sources for Transactions + Injuries. ESPN's hidden API is preferred; NFL.com
# pages are cross-source secondaries. The synthesis prompt grounds transaction/injury bullets
# in these — fabrication of transactions/injuries is a critical bug.
structured_data:
  - id: espn_injuries
    name: "ESPN Injuries (API)"
    fetch: "espn_api"
    type: "espn_injuries"
    # Single league-wide endpoint discovered in Phase 0 (see api-discovery-notes.md).
    # Returns expanded data in one call — simpler than the per-team-id loop in the original plan.
    link_destination: "https://www.espn.com/nfl/injuries"
    max_items: 200
    enabled: true

  - id: espn_transactions
    name: "ESPN Transactions (API)"
    fetch: "espn_api"
    type: "espn_transactions"
    # Endpoint requires /seasons/<YEAR>/ scoping. Empty for the upcoming season during deep
    # offseason — fetcher falls back to prior season automatically.
    link_destination: "https://www.espn.com/nfl/transactions"
    max_items: 200
    enabled: true

  - id: nfl_com_injuries
    name: "NFL.com Injuries (cross-source)"
    url: "https://www.nfl.com/injuries/"
    fetch: "html"
    # Page renders per-game injury reports under .nfl-o-injury-report__unit. Anchors inside
    # link to player profiles or game pages. In deep offseason the page is mostly empty —
    # expected `warn` status until preseason. Selector regex below catches player-profile
    # anchors when present.
    link_pattern: "^/players/[a-z0-9-]+/"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    max_items: 80
    enabled: true

  - id: nfl_com_transactions
    name: "NFL.com Transactions (cross-source)"
    url: "https://www.nfl.com/transactions/"
    fetch: "html"
    # Currently renders class="nfl-o-no-results" — empty during offseason. When populated,
    # transaction rows include player-profile anchors; same selector strategy as injuries.
    # Expect `warn` (0 items) until offseason traffic begins.
    link_pattern: "^/players/[a-z0-9-]+/"
    link_base: "https://www.nfl.com"
    title_strategy: "anchor_text"
    max_items: 80
    enabled: true

# ---- Podcasts -----------------------------------------------------------------------------
