# StreamWire — Politics vertical.
#
# Read by pipeline/tweets.py alongside config/sources.yaml. Everything here lands in the
# `elections` scope of the `politics` vertical; football's file is untouched by it.
#
# Per-handle keys:
#   handle:     without the @. Case is preserved for display but matched lowercase.
#   name:       OPTIONAL display name. Leave it out and the account's own Twitter name is
#               used, which is usually what you want — set it only to override.
#   enabled:    false parks a handle without deleting it. The Worker drops handles that leave
#               this file, so commenting one out stops it being polled on the next sync.
#   feed_only:  true keeps a handle out of digests while still showing it in the feed.
#
# Adding or removing a handle takes effect on the next:
#   python3 pipeline/tweets.py --mode sync-handles

