# StreamWire — AI vertical.
#
# Read through pipeline/verticals.py. Everything here lands in the `ai` scope of the `ai`
# vertical. The mix is deliberate: reporters, policy insiders, forecasters, skeptics, and
# China and economics specialists, so the feed reads as an argument rather than one camp.
#
# Per-handle keys:
#   handle:     without the @. Case is preserved for display but matched lowercase.
#   name:       OPTIONAL display name. Leave it out and the account's own Twitter name is used.
#   enabled:    false parks a handle without deleting it. The Worker drops handles that leave
#               the synced list, so a parked handle is not polled and costs nothing.
#   feed_only:  true keeps a handle out of digests while still showing it in the feed.
#
# Adding or un-parking a handle takes effect on the next sync, and every enabled handle is
# polled, which is billed. Verify before syncing — a misspelled handle returns nothing forever:
#   python3 scripts/verify_handles.py --only <handle>,<handle>
#   python3 pipeline/tweets.py --mode sync-handles
#
# Per-source keys are the same as news_sources in config/sources.yaml, plus:
#   max_items:  most articles kept from this source at once (default 8).
#   icon:       false for a newsletter with no logo of its own, so the list shows its initial
#               instead of the generic Substack mark several of them would share.
# After adding a source: python3 scripts/fetch_source_icons.py
#
# Feeds on a *.substack.com address answer 403 to the hourly run's servers, though they work
# from a laptop. Use the newsletter's own domain, or a mirror on another host, as Import AI and
# Zvi do below. A newsletter with neither can't be an article source here.

# Newsletters publish weekly, so the Articles tab looks back further than football's does.
